name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Grammar is up to date
        run: node scripts/build-grammar.mjs && git diff --exit-code syntaxes/
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run smoke
